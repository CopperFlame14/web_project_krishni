<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus – Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .back {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 1.5rem;
        }

        .back:hover {
            color: #fff;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(108, 99, 255, 0.2);
            border: 1px solid rgba(108, 99, 255, 0.4);
            color: #a78bfa;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        h1 {
            color: #fff;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #6c63ff;
            background: rgba(108, 99, 255, 0.1);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(108, 99, 255, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
        }

        .footer a:hover {
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="card">
        <a href="/welcome" class="back">← Back</a>
        <div class="role-badge" id="role-badge">🎓 Student Login</div>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to your campus account</p>
        <div class="error" id="error-msg"></div>
        <form id="login-form">
            <div class="form-group">
                <label>Username or Email</label>
                <input type="text" id="username" placeholder="Enter username or email" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required
                    autocomplete="current-password">
            </div>
            <button type="submit" class="btn" id="login-btn">Sign In</button>
        </form>
        <div class="footer">Don't have an account? <a href="/register">Register here</a></div>
    </div>
    <script src="/js/api.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        const role = params.get('role') || 'student';
        const badge = document.getElementById('role-badge');

        if (role === 'professor') {
            badge.textContent = '👨‍🏫 Professor Login';
        } else if (role === 'admin') {
            badge.textContent = '🔐 Admin Login';
        } else {
            badge.textContent = '🎓 Student Login';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errEl = document.getElementById('error-msg');
            errEl.style.display = 'none';
            btn.disabled = true; btn.textContent = 'Signing in...';

            const { ok, data } = await API.post('/api/auth/login', {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value
            });

            if (ok && data.token) {
                localStorage.setItem('campus_token', data.token);
                localStorage.setItem('campus_user', JSON.stringify(data.user));
                localStorage.setItem('campus_role', data.user.role);

                // Redirect to respective application dashboards
                if (data.user.role === 'admin') {
                    window.location.href = '/admin/dashboard.html';
                } else if (data.user.role === 'professor') {
                    window.location.href = '/professor/dashboard.html';
                } else {
                    window.location.href = '/student/dashboard.html';
                }
            } else {
                errEl.textContent = data.error || 'Login failed';
                errEl.style.display = 'block';
                btn.disabled = false; btn.textContent = 'Sign In';
            }
        });
    </script>
</body>

</html>
