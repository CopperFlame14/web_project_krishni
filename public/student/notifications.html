<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications – Smart Campus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f0e17;
            color: #fff;
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 240px;
            background: rgba(255, 255, 255, 0.04);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 800;
            color: #a78bfa;
            margin-bottom: 2rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 4px;
            transition: all 0.2s;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(167, 139, 250, 0.15);
            color: #a78bfa;
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .user-info {
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .user-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .user-role {
            font-size: 0.75rem;
            color: #a78bfa;
        }

        .logout-btn {
            width: 100%;
            padding: 10px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            color: #fca5a5;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .main {
            margin-left: 240px;
            padding: 2rem;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .btn-outline {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid rgba(167, 139, 250, 0.4);
            border-radius: 10px;
            color: #a78bfa;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-outline:hover {
            background: rgba(167, 139, 250, 0.1);
        }

        .notif-item {
            display: flex;
            gap: 1rem;
            padding: 1rem 1.25rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .notif-item.unread {
            background: rgba(167, 139, 250, 0.08);
            border-color: rgba(167, 139, 250, 0.2);
        }

        .notif-item:hover {
            border-color: rgba(167, 139, 250, 0.4);
        }

        .notif-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #a78bfa;
            margin-top: 6px;
            flex-shrink: 0;
        }

        .notif-dot.read {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .notif-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .notif-msg {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.4;
        }

        .notif-time {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 4px;
        }

        .type-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .type-class_scheduled {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
        }

        .type-class_cancelled {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .type-class_rescheduled {
            background: rgba(245, 158, 11, 0.2);
            color: #fcd34d;
        }

        .empty {
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
            padding: 4rem;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .main {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <nav class="sidebar">
        <div class="logo">🏫 Smart Campus</div>
        <a href="/student" class="nav-item"><span>🏠</span> Dashboard</a>
        <a href="/student/timetable" class="nav-item"><span>📅</span> My Timetable</a>
        <a href="/student/notifications" class="nav-item active"><span>🔔</span> Notifications</a>
        <a href="/student/empty-rooms.html" class="nav-item"><span>🔍</span> Empty Rooms</a>
        <div class="sidebar-bottom">
            <div class="user-info">
                <div class="user-name" id="sidebar-name">Loading...</div>
                <div class="user-role">🎓 Student</div>
            </div>
            <button class="logout-btn" onclick="API.logout()">Sign Out</button>
        </div>
    </nav>
    <main class="main">
        <div class="topbar">
            <div class="page-title">🔔 Notifications</div>
            <button class="btn-outline" onclick="markAllRead()">Mark all read</button>
        </div>
        <div id="notif-list">
            <div class="empty">Loading...</div>
        </div>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/wsClient.js"></script>
    <script>
        if (!API.requireAuth('student')) { }
        const user = API.getUser();
        if (user) document.getElementById('sidebar-name').textContent = user.full_name || user.username;
        WS.connect();
        WS.onNotification = () => loadNotifications();

        const typeLabels = { class_scheduled: 'Scheduled', class_cancelled: 'Cancelled', class_rescheduled: 'Rescheduled' };

        async function loadNotifications() {
            const data = await API.get('/api/student/notifications');
            if (!data) return;
            const el = document.getElementById('notif-list');
            if (data.notifications.length === 0) { el.innerHTML = '<div class="empty">No notifications yet</div>'; return; }
            el.innerHTML = data.notifications.map(n => `
                <div class="notif-item ${n.is_read ? '' : 'unread'}" onclick="markRead(${n.id}, this)">
                    <div class="notif-dot ${n.is_read ? 'read' : ''}"></div>
                    <div style="flex:1">
                        <div class="type-badge type-${n.type}">${typeLabels[n.type] || n.type}</div>
                        <div class="notif-title">${n.title}</div>
                        <div class="notif-msg">${n.message}</div>
                        <div class="notif-time">${new Date(n.created_at).toLocaleString()}</div>
                    </div>
                </div>`).join('');
        }

        async function markRead(id, el) {
            await API.put(`/api/student/notifications/${id}/read`);
            el.classList.remove('unread');
            el.querySelector('.notif-dot').classList.add('read');
            WS.markRead(id);
        }

        async function markAllRead() {
            await API.put('/api/student/notifications/read-all');
            WS.markAllRead();
            loadNotifications();
        }

        loadNotifications();
    </script>
</body>

</html>
