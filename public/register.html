<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus – Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 460px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .back {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 1.5rem;
        }

        .back:hover {
            color: #fff;
        }

        h1 {
            color: #fff;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        select option {
            background: #302b63;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #6c63ff;
            background: rgba(108, 99, 255, 0.1);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .role-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .role-tab {
            padding: 12px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .role-tab.active {
            border-color: #6c63ff;
            color: #fff;
            background: rgba(108, 99, 255, 0.2);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(108, 99, 255, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #6ee7b7;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <a href="/welcome" class="back">← Back</a>
        <h1>Create Account</h1>
        <p class="subtitle">Join the Smart Campus platform</p>
        <div class="error" id="error-msg"></div>
        <div class="success" id="success-msg"></div>
        <div class="role-tabs">
            <div class="role-tab active" data-role="student" onclick="selectRole('student')">🎓 Student</div>
            <div class="role-tab" data-role="professor" onclick="selectRole('professor')">👨‍🏫 Professor</div>
        </div>
        <input type="hidden" id="role" value="student">
        <form id="register-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="full_name" placeholder="Your full name" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
            </div>
            <button type="submit" class="btn" id="reg-btn">Create Account</button>
        </form>
        <div class="footer">Already have an account? <a href="/login">Sign in</a></div>
    </div>
    <script src="/js/api.js"></script>
    <script>
        function selectRole(role) {
            document.getElementById('role').value = role;
            document.querySelectorAll('.role-tab').forEach(t => t.classList.toggle('active', t.dataset.role === role));
        }
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('reg-btn');
            const errEl = document.getElementById('error-msg');
            const sucEl = document.getElementById('success-msg');
            errEl.style.display = 'none'; sucEl.style.display = 'none';
            btn.disabled = true; btn.textContent = 'Creating account...';
            const { ok, data } = await API.post('/api/auth/register', {
                full_name: document.getElementById('full_name').value.trim(),
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            });
            if (ok && data.token) {
                localStorage.setItem('campus_token', data.token);
                localStorage.setItem('campus_user', JSON.stringify(data.user));
                localStorage.setItem('campus_role', data.user.role);
                sucEl.textContent = 'Account created! Redirecting...';
                sucEl.style.display = 'block';
                setTimeout(() => { window.location.href = data.user.role === 'professor' ? '/professor' : '/student'; }, 1000);
            } else {
                errEl.textContent = data.error || 'Registration failed';
                errEl.style.display = 'block';
                btn.disabled = false; btn.textContent = 'Create Account';
            }
        });
    </script>
</body>

</html>
