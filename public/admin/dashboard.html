<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Governance Portal - Smart Campus</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --admin-primary: #6366f1;
            --admin-bg: #0f172a;
            --admin-card: #1e293b;
        }

        body {
            background-color: var(--admin-bg);
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: var(--admin-card);
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--admin-card);
            padding: 1.5rem;
            border-radius: 1rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--admin-primary);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--admin-primary);
            margin: 0.5rem 0;
        }

        .freeze-banner {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            display: none;
        }

        .freeze-banner.active {
            display: flex;
        }

        .control-panel {
            background: var(--admin-card);
            padding: 2rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
        }

        .tab-nav {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
        }

        .tab-btn {
            background: none;
            border: none;
            color: #94a3b8;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--admin-primary);
            border-bottom: 2px solid var(--admin-primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th,
        td {
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            color: #94a3b8;
            font-weight: 400;
        }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 1rem;
            font-size: 0.8rem;
        }

        .badge-frozen {
            background: #ef4444;
            color: white;
        }

        .badge-active {
            background: #10b981;
            color: white;
        }

        .btn-freeze {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-unfreeze {
            background: #10b981;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <header class="header-actions">
            <div>
                <h1>Campus Governance Portal</h1>
                <p id="admin-welcome">Loading admin session...</p>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </header>

        <div id="freeze-alert" class="freeze-banner">
            <div>
                <strong>SYSTEM FROZEN:</strong> Enrollments and timetable modifications are locked.
            </div>
            <button class="btn-unfreeze" onclick="toggleFreeze(false)">Lift Freeze</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div>Professors</div>
                <div id="stat-profs" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div>Students</div>
                <div id="stat-students" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div>Active Courses</div>
                <div id="stat-courses" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div>Enrollments</div>
                <div id="stat-enrollments" class="stat-value">0</div>
            </div>
        </div>

        <div class="control-panel">
            <div class="tab-nav">
                <button class="tab-btn active" onclick="switchTab('professors')">Professors</button>
                <button class="tab-btn" onclick="switchTab('courses')">Courses</button>
                <button class="tab-btn" onclick="switchTab('enrollments')">Enrollments</button>
                <button class="tab-btn" onclick="switchTab('settings')">System Settings</button>
            </div>

            <div id="table-container">
                <table>
                    <thead>
                        <tr id="table-head"></tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>

            <div id="settings-view" style="display: none;">
                <h2>Governance Controls</h2>
                <div
                    style="margin-top: 1.5rem; padding: 1.5rem; background: rgba(255,255,255,0.05); border-radius: 0.5rem;">
                    <h3>Enrollment Freeze</h3>
                    <p style="color: #94a3b8; margin: 0.5rem 0 1.5rem 0;">Locks all students from adding/dropping
                        courses or uploading new timetables.</p>
                    <div id="freeze-toggle-area">
                        <!-- Dynamic toggle button -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        if (!API.requireAuth('admin')) { }
        const user = API.getUser();
        if (user) document.getElementById('admin-welcome').innerText = `Welcome, ${user.full_name || user.username} (System Admin)`;

        let currentTab = 'professors';

        async function init() {
            try {
                const data = await API.get('/api/admin/dashboard');
                if (!data) return; // API.get handles 401 redirect
                document.getElementById('stat-profs').innerText = data.professors;
                document.getElementById('stat-students').innerText = data.students;
                document.getElementById('stat-courses').innerText = data.courses;
                document.getElementById('stat-enrollments').innerText = data.enrollments;

                const alert = document.getElementById('freeze-alert');
                if (data.isFrozen) alert.classList.add('active');
                else alert.classList.remove('active');

                renderSettings(data.isFrozen);
                loadTabData();
            } catch (err) {
                console.error(err);
            }
        }

        async function loadTabData() {
            try {
                const data = await API.get(`/api/admin/${currentTab}`);
                if (data && !data.error) renderTable(data);
                else if (data && data.error) console.error('API Error:', data.error);
            } catch (err) {
                console.error('Fetch error:', err);
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            if (tab === 'settings') {
                document.getElementById('table-container').style.display = 'none';
                document.getElementById('settings-view').style.display = 'block';
            } else {
                document.getElementById('table-container').style.display = 'block';
                document.getElementById('settings-view').style.display = 'none';
                loadTabData();
            }
        }

        function renderTable(data) {
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');
            head.innerHTML = '';
            body.innerHTML = '';

            if (!Array.isArray(data)) {
                body.innerHTML = `<tr><td colspan="3" style="text-align:center;color:#fca5a5;padding:2rem;">⚠️ Failed to load data. The database might need a migration (migrate_v4.sql).</td></tr>`;
                return;
            }

            if (currentTab === 'professors') {
                head.innerHTML = '<th>Name</th><th>Email</th><th>Courses</th>';
                data.forEach(p => {
                    body.innerHTML += `<tr><td>${p.full_name}</td><td>${p.email}</td><td>${p.course_count}</td></tr>`;
                });
            } else if (currentTab === 'courses') {
                head.innerHTML = '<th>Code</th><th>Name</th><th>Professor</th><th>Enrolled</th>';
                data.forEach(c => {
                    body.innerHTML += `<tr><td>${c.code}</td><td>${c.name}</td><td>${c.professor_name}</td><td>${c.enrolled_count}</td></tr>`;
                });
            } else if (currentTab === 'enrollments') {
                head.innerHTML = '<th>Student</th><th>Course</th><th>Date</th>';
                data.forEach(e => {
                    body.innerHTML += `<tr><td>${e.student_name}</td><td>${e.course_code} - ${e.course_name}</td><td>${new Date(e.enrolled_at).toLocaleDateString()}</td></tr>`;
                });
            }
        }

        function renderSettings(isFrozen) {
            const area = document.getElementById('freeze-toggle-area');
            if (isFrozen) {
                area.innerHTML = `<button class="btn-unfreeze" onclick="toggleFreeze(false)">Lift System Freeze</button>`;
            } else {
                area.innerHTML = `<button class="btn-freeze" onclick="toggleFreeze(true)">Activate Enrollment Freeze</button>`;
            }
        }

        async function toggleFreeze(status) {
            if (status && !confirm('Are you sure? This will lock enrollment for all students.')) return;

            const res = await API.post('/api/admin/freeze', { status });
            if (res.ok) init();
            else alert(res.data.error || 'Failed to update system state');
        }

        function logout() {
            API.logout();
        }

        init();
    </script>
</body>

</html>
