<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood Tracker | AI Student Planner</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="mobile-overlay" id="mobileOverlay"></div>

  <div class="dashboard-layout">
    
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>My Planner</h2>
        <button class="close-sidebar-btn" id="closeSidebarBtn"><i class="ph ph-x"></i></button>
      </div>
      
      <ul class="nav-links">
        <li>
          <a class="nav-item" href="dashboard.html">
            <i class="ph ph-squares-four"></i><span>Dashboard</span>
          </a>
        </li>
        <li>
          <a class="nav-item" href="calendar.html">
            <i class="ph ph-calendar-blank"></i><span>Calendar</span>
          </a>
        </li>
        <li>
          <a class="nav-item" href="subjects.html">
            <i class="ph ph-books"></i><span>Subjects</span>
          </a>
        </li>
        <li>
          <a class="nav-item" href="habits.html">
            <i class="ph ph-arrows-clockwise"></i><span>Habits</span>
          </a>
        </li>
        <li>
          <a class="nav-item" href="progress.html">
            <i class="ph ph-chart-line-up"></i><span>Progress</span>
          </a>
        </li>
        <li>
          <a class="nav-item active" href="mood.html">
            <i class="ph ph-smiley"></i><span>Mood Tracker</span>
          </a>
        </li>
        <li>
          <a class="nav-item" href="study.html">
            <i class="ph ph-timer"></i><span>Timer</span>
          </a>
        </li>
        <li>
          <a class="nav-item" href="games.html">
            <i class="ph ph-game-controller"></i><span>Games</span>
          </a>
        </li>
      </ul>

      <div class="nav-logout">
        <a class="nav-item" id="logoutBtn"><i class="ph ph-sign-out"></i><span>Logout</span></a>
      </div>
    </aside>

    <main class="main-content">
      <header class="dashboard-header">
        <div>
          <h1>Mood Tracker</h1>
          <p style="color: var(--text-muted); margin-top: 0.5rem;">How are you feeling today?</p>
        </div>
        <div class="header-actions">
          <button class="hamburger-btn" id="hamburgerBtn"><i class="ph ph-list"></i></button>
        </div>
      </header>

      <div class="mood-container">
        
        <div class="mood-grid" id="moodGrid">
           <!-- Cards are generated by JS to handle events cleanly -->
        </div>

        <div class="ai-feedback-area" id="aiFeedbackArea">
           <i class="ph ph-magic-wand"></i>
           <div class="ai-feedback-text">
             <h3>AI Insights</h3>
             <p id="aiFeedbackText" style="color: var(--text-muted); line-height: 1.5;">...</p>
           </div>
        </div>

      </div>

    </main>
  </div>

  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="dashboard.js"></script> 
  <script src="mood.js"></script>
</body>
</html>
